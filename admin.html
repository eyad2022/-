<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | إدارة محتوى الكتب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  
  <!-- استدعاء Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #EEF1F7; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-[#12213F] mb-6 text-center">إضافة تفاصيل الكتاب</h2>
    
    <form id="admin-form" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">رقم الكتاب (Daftra ID)</label>
        <input type="text" id="book-id" required class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#C6982F]" placeholder="مثال: 105">
        <p class="text-xs text-gray-500 mt-1">يجب أن يكون الرقم مطابقاً لرقم المنتج في دفترة.</p>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">النبذة عن الكتاب</label>
        <textarea id="book-desc" required rows="4" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#C6982F]" placeholder="اكتب النبذة المشوقة هنا..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">مقاس الكتاب وعدد الصفحات</label>
        <input type="text" id="book-size" required class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#C6982F]" placeholder="مثال: 14x21 سم - 300 صفحة">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-[#12213F] text-white font-bold py-3 rounded hover:bg-[#C6982F] transition">
        حفظ البيانات
      </button>
      <p id="status-msg" class="text-center font-bold text-sm mt-3 hidden"></p>
    </form>
  </div>

  <script>
    // >>> ضع إعدادات Firebase الخاصة بك هنا <<<
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("admin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const status = document.getElementById("status-msg");
      
      const bookId = document.getElementById("book-id").value.trim();
      const description = document.getElementById("book-desc").value.trim();
      const size = document.getElementById("book-size").value.trim();

      btn.disabled = true;
      btn.textContent = "جاري الحفظ...";

      try {
        // حفظ البيانات في مجموعة books_meta برقم الـ ID الخاص بدفترة
        await db.collection("books_meta").doc(bookId).set({
          description: description,
          size: size,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        status.textContent = "تم حفظ التفاصيل بنجاح!";
        status.className = "text-center font-bold text-sm mt-3 text-green-600 block";
        document.getElementById("admin-form").reset();
      } catch (error) {
        console.error("Error writing document: ", error);
        status.textContent = "حدث خطأ أثناء الحفظ.";
        status.className = "text-center font-bold text-sm mt-3 text-red-600 block";
      } finally {
        btn.disabled = false;
        btn.textContent = "حفظ البيانات";
        setTimeout(() => { status.classList.add("hidden"); }, 3000);
      }
    });
  </script>
</body>
</html>
